[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-alns-usv-b-public"
version = "0.2.0"
description = "Configurable USV route-search runtime with external experiment assets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
llm-alns-b = "llm_alns_b.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_alns_b = ["demo_parameters.json"]
